services:
  agv-control-system:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "8113:8113"
    volumes:
      - ..:/app
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8113/api/system/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agv-network

networks:
  agv-network:
    driver: bridge